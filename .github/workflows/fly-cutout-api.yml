name: Deploy cutout API to Fly

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Fly app name
        required: true
        default: vilo-cutout-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: >
          flyctl deploy
          --config services/cutout_api/fly.toml.example
          --app "${{ inputs.app_name }}"
          --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
