app = "vilo-cutout-api-zino"
primary_region = "nrt"

[build]
  dockerfile = "services/cutout_api/Dockerfile"

[env]
  VILO_CUTOUT_MODEL = "isnet-general-use"
  VILO_MAX_UPLOAD_MB = "12"
  VILO_MAX_INPUT_PIXELS = "9000000"
  VILO_CORS_ORIGINS = "https://zino-tea-ai.github.io,http://127.0.0.1:5188,http://localhost:5188"
  VILO_WARMUP = "1"
  VILO_ANALYZE_PROVIDER = "openrouter"
  VILO_OPENROUTER_MODEL = "google/gemini-2.5-flash"
  VILO_OPENROUTER_SITE_URL = "https://zino-tea-ai.github.io/sway-nutrition-web/"
  VILO_OPENROUTER_APP_TITLE = "Vilo Sticker Lab"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
